<script>

/***** BEGIN UTILITIES ***/

function convertTimeToSeconds(hms){
  var a = hms.split(':');
  var seconds = (+a[0]) * 60 * 60 + (+a[1]) * 60 + (+a[2]);
  return seconds;
}

function returnWidthPercent(elem){
  var pa= elem.offsetParent || elem;
  return ((elem.offsetWidth/pa.offsetWidth)*100).toFixed(2)+'%';
}

function returnSecondsToHms(d) {
    d = Number(d);
    var h = Math.floor(d / 3600);
    var m = Math.floor(d % 3600 / 60);
    var s = Math.floor(d % 3600 % 60);
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

//get items, add to playlist
function retrieveItems(){
  $.ajax({
      url: '/embed/list/id/680989/offset/' + offset + '/size/' + totalTracksToFillPlaylist + '/sort_by_field/release_date/sort_by_direction/' + sort + '/category/'+category + '/no-cache/false',
      async: false,
      success: function(data) {
        if(data == false){
          $(".nano").unbind("scrollend");
        } else {
          for(var i = 0; i < data.length; i++) {
            if(origItem != data[i].item_id){
              data[i].duration_seconds = convertTimeToSeconds(data[i].duration);

              //need to do one quick ping for IOS, ping request will be deleted after one ping
              if(isIosRequest && !data[i].is_free && data[i].media_url != data[i].media_url_libsyn){
                data[i].prepend_ping = data[i].media_url.replace('libsyn.com/', 'libsyn.com/libsyn-ping-only/true/');
                data[i].media_url = data[i].media_url_libsyn;
              }

              addToPlaylist(data[i]);
            }
          }
        }

function playPlayer(trackChanged){
  //remove overlay
  $(".dark-overlay").fadeOut();

  if(!playList[currentTrack]){
    currentTrack = 0;
  }

  if(player.src == ""){
      player.src = playList[currentTrack].media_url;
      if(debug) console.log("media loaded");
  }

  //if track has changed
  if(trackChanged){

    //pause the player
    pausePlayer();

    //check for premium
    if(!playList[currentTrack].is_free && !premium_access){
      //denied
      $("#denied-overlay").slideDown("fast");
      return false;
    }

    //update the player
    updatePlayer(trackChanged);

  }

  var isVideo = playList[currentTrack].is_video;
  if(isVideo && mode == "audio"){
    renderVideoMode();
  }
  else if(!isVideo && mode == "video"){
    renderAudioMode();
  }

  //play track
  player.play();
  $(".play").hide();
  $(".pause").show();
}

  currentTimeStart = player.currentTime;

$(document).keydown(function(event){
	var keycode = (event.keyCode ? event.keyCode : event.which);
	if(keycode == '13' || keycode == '32'){
		var activeElementId = $(document.activeElement).context.id;
		switch(activeElementId){
			case "play-player":
				playPlayer();
				$("#pause-player").focus();
				break;
			case "pause-player":
				pausePlayer();
				$("#play-player").focus();
				break;
			case "back-player":
				$(".prev").trigger("click");
				break;
			case "skip-player":
				$(".skip").trigger("click");
				break;
			case "back-thirty-player":
				$(".prev-thirty").trigger("click");
				break;
			case "skip-thirty-player":
				$(".skip-thirty").trigger("click");
				break;
			default:
				// spacebar to play/pause when not on specific control
				if(keycode == '32'){
					if(player.paused){
						playPlayer();
					} else {
						pausePlayer();
					}
				}
		}

		// prevent the autoscroll thing some browsers do. this is a player.
		if(keycode == '32'){
			event.preventDefault();
		}
	}
});

function receiveMessage(e) {

    var curTime = Math.ceil(player.currentTime);
    var timeElapsed = returnSecondsToHms(Math.ceil(curTime));
    var playerDataArr = {'elapsed':timeElapsed};

}
